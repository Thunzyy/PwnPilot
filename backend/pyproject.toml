[project]
name = "pwnpilot-backend"
version = "0.1.0"
description = "PwnPilot Backend API"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "venv",
    ".venv",
    "__pycache__",
    "alembic",
    "tests",
    "data/community",
    ".pytest-runtime",
    ".pytest_cache",
    ".codex-tmp",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "."
cache_dir = ".codex-tmp/pytest-cache"
